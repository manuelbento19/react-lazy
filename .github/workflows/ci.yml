name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26; undici 8 requires >=22.19.
        # Pinning an older Node fails at require('jsdom') with
        # "webidl.util.markAsUncloneable is not a function".
        node-version: ['22.22.2', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          grep -q "process\.env" dist/index.js && exit 1 || exit 0
          grep -q "react.transitional.element" dist/index.js && exit 1 || exit 0
          echo "Build artifacts verified"
